version: '3.8'

services:

  db:
    image: mysql:8.0
    container_name: mysql_db
    ports:
      - "3306:3306"
    env_file:
      - ./backend/tour_api/.env.tours
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      start_period: 10s

  tour_api:
    build:
      context: ./backend/tour_api
    container_name: flask_tour_api
    ports:
      - "3001:3001"
    volumes:
      - ./backend/tour_api:/app
      - ./backend/uploads:/app/uploads
    working_dir: /app
    env_file:
      - ./backend/tour_api/.env.tours
    environment:
      FLASK_APP: main.py
      FLASK_ENV: development
      FLASK_DEBUG: 1
      APP_ENV: development
      # Optionally set REDIS_HOST in this env block or in .env.tours:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    command: flask run --host=0.0.0.0 --port=3001
    depends_on:
      db:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  hotel_api:
    build:
      context: ./backend/hotel_api
    container_name: flask_hotel_api
    ports:
      - "5000:5000"
    volumes:
      - ./backend/hotel_api:/app
    working_dir: /app
    env_file:
      - ./backend/hotel_api/.env.hotels
    environment:
      FLASK_APP: hotel_app.py
      FLASK_ENV: development
      APP_ENV: development
    command: flask run --host=0.0.0.0 --port=5000
    depends_on:
      db:
        condition: service_healthy
    restart: always

  car_api:
    build:
      context: ./backend/car_api
    container_name: flask_car_api
    ports:
      - "5001:5001"
    volumes:
      - ./backend/car_api:/app
    working_dir: /app
    env_file:
      - ./backend/car_api/.env.cars
    environment:
      FLASK_APP: car_app.py
      FLASK_ENV: development
      APP_ENV: development
    command: flask run --host=0.0.0.0 --port=5001
    depends_on:
      db:
        condition: service_healthy
    restart: always

  frontend:
    build:
      context: ./frontend
    container_name: vite_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    working_dir: /app
    command: ["npm", "run", "dev"]
    restart: always

  # ---------- Redis service added ----------
  redis:
    image: redis:7-alpine
    container_name: redis_local
    ports:
      - "6379:6379"       # host:container - change left side if host port conflict
    volumes:
      - redis-data:/data   # persist dump/aof to a volume (useful for dev)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    # networks: default (compose will attach to default network so services can reach 'redis')
  # ------------------------------------------

volumes:
  db_data:
  redis-data:
